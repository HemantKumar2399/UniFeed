name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: unifeed_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d unifeed_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_SECRET: ci-auth-secret-for-disposable-tests
      STUDENT_QR_SECRET: ci-student-qr-secret-for-disposable-tests
      ALLOWED_DOMAINS: students.example.edu
      DATABASE_URL: postgresql://postgres:test-password@localhost:5432/unifeed_test
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/unifeed_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - name: Prepare disposable demo data
        run: node --import tsx prisma/seed.ts --reset-demo
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npx tsx scripts/bootstrap-e2e-smoke.ts && npx playwright test --project=chromium --workers=1 tests/e2e/epic16-smoke.spec.ts tests/e2e/epic17-realtime.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-results
          path: |
            playwright-report/
            test-results/
