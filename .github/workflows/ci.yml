name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALLOWED_DOMAINS: students.edu.in
      DATABASE_URL: postgresql://postgres:password@localhost:5432/Platform
      UPLOAD_BUCKET_NAME: test-bucket
      UPLOAD_REGION: us-east-1
      UPLOAD_ACCESS_KEY_ID: test
      UPLOAD_SECRET_ACCESS_KEY: test

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint

    - name: Run Typecheck
      run: npm run typecheck

    - name: Run Build
      run: npm run build

    - name: Run Unit Tests
      run: npm run test:unit
